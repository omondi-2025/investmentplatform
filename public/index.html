<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>TUST VANILLA  Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <header>
    <button onclick="toggleSupport()" style="background:none;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;gap:4px;font-weight:600;font-size:0.88rem;">
      <span class="material-symbols-outlined" style="font-size:20px;">support_agent</span>Support
    </button>
    <span style="font-weight:800;font-size:1.05rem;letter-spacing:0.5px;">TUST VANILLA</span>
    <button onclick="logout()" style="background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.35);color:#fff;border-radius:20px;padding:6px 12px;font-size:0.82rem;font-weight:600;cursor:pointer;">Logout</button>
  </header>

  <div class="support-modal" id="supportBox">
    <a href="https://t.me/TUST VANILLAchannel" target="_blank">
      <span class="material-symbols-outlined" style="vertical-align:middle;font-size:16px;margin-right:4px;">campaign</span>Telegram Channel
    </a>
    <a href="https://t.me/TUST VANILLAsupport" target="_blank">
      <span class="material-symbols-outlined" style="vertical-align:middle;font-size:16px;margin-right:4px;">chat</span>Customer Support
    </a>
  </div>

  <div class="wallet-info">
    <div style="font-size:0.82rem;opacity:0.82;" id="userEmail">Loading...</div>
    <div style="font-size:1.2rem;font-weight:800;margin:5px 0;" id="userName">---</div>
    <div class="wallet-stats">
      <div class="wallet-box">Balance<strong>KES <span id="wallet">0</span></strong></div>
      <div class="wallet-box">Cashouts<strong>KES <span id="cashouts">0.00</span></strong></div>
      <div class="wallet-box">Invested<strong>KES <span id="expense">0.00</span></strong></div>
      <div class="wallet-box">Daily<strong>KES <span id="income">0.00</span></strong></div>
    </div>
  </div>

  <div class="activity-feed">
    <div class="activity-feed-header">
      <span class="live-dot"></span>
      Live Activity
    </div>
    <div class="activity-ticker">
      <div class="activity-track" id="activityTrack"></div>
    </div>
  </div>

  <div class="card" style="margin:0 1rem 1rem;">
    <div class="section-title">Quick Access</div>
    <div class="grid-buttons">
      <a href="deposit.html">
        <span class="material-symbols-outlined">account_balance_wallet</span>Deposit
      </a>
      <a href="package.html">
        <span class="material-symbols-outlined">trending_up</span>Invest
      </a>
      <a href="withdrawal.html">
        <span class="material-symbols-outlined">payments</span>Cashout
      </a>
      <a href="agent.html">
        <span class="material-symbols-outlined">group</span>Team
      </a>
      <a href="profile.html">
        <span class="material-symbols-outlined">person</span>Profile
      </a>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    (function initLiveActivity() {
      var amounts = [300, 500, 900, 1500, 2000, 2500, 3500, 4200, 5480, 6000, 7500, 10000, 13300, 15000, 20000, 26600];
      var packages = ["KES 300", "KES 500", "KES 900", "KES 1,700", "KES 5,000", "KES 10,000"];

      function randomPhone() {
        var prefix = Math.random() > 0.25 ? "07" : "01";
        var digits = "";
        for (var i = 0; i < 8; i++) digits += Math.floor(Math.random() * 10);
        return prefix + digits;
      }

      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function maskPhone(phone) {
        return phone.slice(0, 4) + "****" + phone.slice(-2);
      }

      function buildActivity() {
        var phone = randomPhone();
        var masked = maskPhone(phone);
        var amount = pick(amounts);
        var templates = [
          { icon: "payments", bg: "#fee2e2", color: "#dc2626", html: "<strong>" + masked + "</strong> has withdrawn <span class=\"amount\">KES " + amount.toLocaleString() + "</span>" },
          { icon: "account_balance_wallet", bg: "#d1fae5", color: "#059669", html: "<strong>" + masked + "</strong> deposited <span class=\"amount\">KES " + amount.toLocaleString() + "</span> successfully" },
          { icon: "trending_up", bg: "#e8f0fe", color: "#004aad", html: "<strong>" + masked + "</strong> invested <span class=\"amount\">KES " + amount.toLocaleString() + "</span> in " + pick(packages) + " package" },
          { icon: "savings", bg: "#fef3c7", color: "#d97706", html: "<strong>" + masked + "</strong> earned <span class=\"amount\">KES " + Math.floor(amount * 0.2).toLocaleString() + "</span> daily returns" },
          { icon: "group", bg: "#ede9fe", color: "#7c3aed", html: "<strong>" + masked + "</strong> received <span class=\"amount\">KES " + Math.floor(amount * 0.15).toLocaleString() + "</span> referral bonus" },
          { icon: "person_add", bg: "#e0f2fe", color: "#0284c7", html: "<strong>" + masked + "</strong> joined TUST VANILLA successfully" },
          { icon: "verified", bg: "#d1fae5", color: "#059669", html: "<strong>" + masked + "</strong> completed withdrawal of <span class=\"amount\">KES " + amount.toLocaleString() + "</span>" },
          { icon: "bolt", bg: "#fff7ed", color: "#ea580c", html: "<strong>" + masked + "</strong> recharged wallet with <span class=\"amount\">KES " + amount.toLocaleString() + "</span>" }
        ];
        return pick(templates);
      }

      function renderActivities() {
        var track = document.getElementById("activityTrack");
        if (!track) return;

        var items = [];
        for (var i = 0; i < 18; i++) {
          var activity = buildActivity();
          items.push(
            '<div class="activity-item">' +
              '<div class="activity-icon" style="background:' + activity.bg + ';color:' + activity.color + '">' +
                '<span class="material-symbols-outlined">' + activity.icon + '</span>' +
              '</div>' +
              '<div class="activity-text">' + activity.html + '</div>' +
            '</div>'
          );
        }

        track.innerHTML = items.join("") + items.join("");
        track.classList.add("scrolling");
        track.style.setProperty("--scroll-duration", "45s");
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", renderActivities);
      } else {
        renderActivities();
      }
    })();

    function logout() { localStorage.clear(); window.location.href = "login.html"; }
    function toggleSupport() {
      var box = document.getElementById("supportBox");
      box.style.display = box.style.display === "block" ? "none" : "block";
    }
    document.addEventListener("DOMContentLoaded", async () => {
      const BASE_URL = ["localhost","127.0.0.1"].includes(window.location.hostname)
        ? window.location.origin : "https://investmentplatform.onrender.com";
      const currentUser = JSON.parse(localStorage.getItem("tc_user"));
      if (!currentUser || !currentUser._id) { window.location.href = "login.html"; return; }
      try {
        const res = await fetch(`${BASE_URL}/api/user/${currentUser._id}`);
        const user = await res.json();
        document.getElementById("userName").textContent = user.fullName || "User";
        document.getElementById("userEmail").textContent = user.email || "";
        document.getElementById("wallet").textContent = (user.wallet||0).toFixed(2);
        document.getElementById("cashouts").textContent = (user.cashouts||0).toFixed(2);
        document.getElementById("expense").textContent = (user.expense||0).toFixed(2);
        document.getElementById("income").textContent = (user.dailyIncome||0).toFixed(2);
      } catch (e) { console.error(e); logout(); }
    });
  </script>
</body>
</html>
