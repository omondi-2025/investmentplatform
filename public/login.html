<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
	<title>TUST VANILLA - Login</title>
	<link rel="stylesheet" href="styles.css" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
	<style>
		body {
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			margin: 0;
			padding: 1rem;
			background: linear-gradient(160deg, #e8f0fe 0%, #f0f4f9 100%);
		}

		.wrap {
			width: 100%;
			max-width: 420px;
		}

		.brand {
			text-align: center;
			color: var(--primary);
			margin-bottom: 1rem;
			font-size: 1.7rem;
			font-weight: 900;
			letter-spacing: 0.8px;
		}

		.switch {
			margin-top: 1rem;
			text-align: center;
			color: var(--text-2);
			font-size: 0.9rem;
		}

		.switch a {
			color: var(--primary);
			text-decoration: none;
			font-weight: 700;
		}
	</style>
</head>
<body>
	<div class="wrap">
		<div class="brand">TUST VANILLA</div>
		<div class="login-box">
			<form id="loginForm">
				<div class="form-group">
					<label for="email">Email</label>
					<input type="email" id="email" required placeholder="you@example.com" />
				</div>

				<div class="form-group">
					<label for="password">Password</label>
					<input type="password" id="password" required placeholder="Enter your password" />
				</div>

				<button type="submit">Login</button>
				<div id="loginMessage"></div>
			</form>

			<div class="switch">
				Don't have an account? <a id="signupLink" href="signup.html">Sign up</a>
			</div>
		</div>
	</div>

	<script>
		const loginForm = document.getElementById("loginForm");
		const loginMessage = document.getElementById("loginMessage");
		const signupLink = document.getElementById("signupLink");
		const baseUrl = ["localhost", "127.0.0.1"].includes(window.location.hostname)
			? window.location.origin
			: "https://investmentplatform.onrender.com";

		const urlParams = new URLSearchParams(window.location.search);
		const refCode = urlParams.get("ref");
		if (refCode) signupLink.href = `signup.html?ref=${refCode}`;

		if (localStorage.getItem("tc_user")) {
			window.location.href = "index.html";
		}

		loginForm.addEventListener("submit", async (e) => {
			e.preventDefault();
			const email = document.getElementById("email").value.trim();
			const password = document.getElementById("password").value.trim();

			const submitBtn = loginForm.querySelector("button[type='submit']");
			submitBtn.disabled = true;
			submitBtn.textContent = "Logging in...";

			loginMessage.textContent = "";
			loginMessage.className = "alert";

			try {
				const res = await fetch(`${baseUrl}/api/login`, {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ email, password })
				});

				const data = await res.json();

				if (res.ok && data.success) {
					localStorage.setItem("tc_user", JSON.stringify(data.user));
					loginMessage.textContent = "Login successful! Redirecting...";
					loginMessage.className = "alert success";
					setTimeout(() => window.location.href = "index.html", 1000);
				} else {
					loginMessage.textContent = data.message || "Login failed.";
					loginMessage.className = "alert error";
					submitBtn.disabled = false;
					submitBtn.textContent = "Login";
				}
			} catch (err) {
				loginMessage.textContent = "Error connecting to server.";
				loginMessage.className = "alert error";
				submitBtn.disabled = false;
				submitBtn.textContent = "Login";
			}
		});
	</script>
	<script src="nav.js"></script>
</body>
</html>
