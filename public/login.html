<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
	<title>TUST VANILLA - Login</title>
	<link rel="stylesheet" href="styles.css" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="auth-page">
	<div class="auth-wrap">
		<div class="auth-brand">TUST VANILLA</div>
		<div class="login-box">
			<form id="loginForm">
				<div class="form-group">
					<label for="email">Email</label>
					<div class="input-wrap">
						<span class="material-symbols-outlined input-icon">mail</span>
						<input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />
					</div>
				</div>

				<div class="form-group">
					<label for="password">Password</label>
					<div class="input-wrap password-wrap">
						<span class="material-symbols-outlined input-icon">lock</span>
						<input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password" />
						<button type="button" class="toggle-password" aria-label="Show password" data-target="password">
							<span class="material-symbols-outlined">visibility</span>
						</button>
					</div>
				</div>

				<button type="submit">Login</button>
				<div id="loginMessage"></div>
			</form>

			<div class="auth-switch">
				Don't have an account? <a id="signupLink" href="signup.html">Sign up</a>
			</div>
		</div>
	</div>

	<script>
		document.querySelectorAll(".toggle-password").forEach(function (btn) {
			btn.addEventListener("click", function () {
				var input = document.getElementById(btn.dataset.target);
				var icon = btn.querySelector(".material-symbols-outlined");
				var isHidden = input.type === "password";
				input.type = isHidden ? "text" : "password";
				icon.textContent = isHidden ? "visibility_off" : "visibility";
				btn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
			});
		});

		const loginForm = document.getElementById("loginForm");
		const loginMessage = document.getElementById("loginMessage");
		const signupLink = document.getElementById("signupLink");
		const baseUrl = ["localhost", "127.0.0.1"].includes(window.location.hostname)
			? window.location.origin
			: "https://investmentplatform.onrender.com";

		const urlParams = new URLSearchParams(window.location.search);
		const refCode = urlParams.get("ref");
		if (refCode) signupLink.href = `signup.html?ref=${refCode}`;

		if (localStorage.getItem("tc_user")) {
			window.location.href = "index.html";
		}

		loginForm.addEventListener("submit", async (e) => {
			e.preventDefault();
			const email = document.getElementById("email").value.trim();
			const password = document.getElementById("password").value.trim();

			const submitBtn = loginForm.querySelector("button[type='submit']");
			submitBtn.disabled = true;
			submitBtn.textContent = "Logging in...";

			loginMessage.textContent = "";
			loginMessage.className = "alert";

			try {
				const res = await fetch(`${baseUrl}/api/login`, {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ email, password })
				});

				const data = await res.json();

				if (res.ok && data.success) {
					localStorage.setItem("tc_user", JSON.stringify(data.user));
					loginMessage.textContent = "Login successful! Redirecting...";
					loginMessage.className = "alert success";
					setTimeout(() => window.location.href = "index.html", 1000);
				} else {
					loginMessage.textContent = data.message || "Login failed.";
					loginMessage.className = "alert error";
					submitBtn.disabled = false;
					submitBtn.textContent = "Login";
				}
			} catch (err) {
				loginMessage.textContent = "Error connecting to server.";
				loginMessage.className = "alert error";
				submitBtn.disabled = false;
				submitBtn.textContent = "Login";
			}
		});
	</script>
	<script src="nav.js"></script>
</body>
</html>
