<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>TUST VANILLA - Transactions</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    .history-wrap {
      max-width: 760px;
      margin: 1rem auto;
      padding: 0 1rem 1rem;
    }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .history-total {
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      padding: 0.9rem;
      border: 1px solid var(--border);
    }
    .history-total small {
      color: var(--text-2);
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .history-total strong {
      color: var(--primary);
      font-size: 1rem;
    }
    .status-chip {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-chip.pending {
      background: #fef3c7;
      color: #92400e;
    }
    .status-chip.approved {
      background: #dcfce7;
      color: #166534;
    }
    .status-chip.rejected {
      background: #fee2e2;
      color: #991b1b;
    }
    .history-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      gap: 0.6rem;
    }
    .history-refresh {
      width: auto;
      max-width: 170px;
      padding: 0.55rem 0.95rem;
      font-size: 0.85rem;
    }
    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .history-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 0.65rem;
      padding: 0.9rem;
    }
    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 5px;
    }
    .history-meta {
      color: var(--text-2);
      font-size: 0.8rem;
      margin-top: 2px;
    }
    @media (max-width: 600px) {
      .history-grid { grid-template-columns: 1fr; }
      .history-actions { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <a href="profile.html" class="back-arrow"><span class="material-symbols-outlined">arrow_back</span></a>
    <h3>TUST VANILLA - Transactions</h3>
    <span style="width:24px;"></span>
  </header>

  <div class="history-wrap">
    <div class="history-grid">
      <div class="history-total"><small>Total Recharged (Approved)</small><strong id="tRecharge">KES 0.00</strong></div>
      <div class="history-total"><small>Total Withdrawn (Approved)</small><strong id="tWithdraw">KES 0.00</strong></div>
      <div class="history-total"><small>Pending Recharges</small><strong id="countRechargePending">0</strong></div>
      <div class="history-total"><small>Pending Withdrawals</small><strong id="countWithdrawalPending">0</strong></div>
    </div>

    <div class="card">
      <div class="history-actions">
        <button id="refreshHistoryBtn" class="history-refresh" type="button">Refresh</button>
        <span class="history-meta">Status is controlled by admin approval.</span>
      </div>
      <div class="section-title">Recharge History</div>
      <ul id="rechargeList" class="history-list">
        <li class="history-item">Loading recharge history...</li>
      </ul>
    </div>

    <div class="card" style="margin-top:0.9rem;">
      <div class="section-title">Withdrawal History</div>
      <ul id="withdrawalList" class="history-list">
        <li class="history-item">Loading withdrawal history...</li>
      </ul>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const BASE_URL = window.location.origin;
    let historyPollTimer = null;

    function fmt(value) {
      return `KES ${Number(value || 0).toFixed(2)}`;
    }

    function normalizeRechargeStatus(status) {
      const s = String(status || "").toLowerCase();
      if (s === "confirmed") return "approved";
      if (s === "approved" || s === "rejected" || s === "pending") return s;
      return "pending";
    }

    function normalizeWithdrawalStatus(status) {
      const s = String(status || "").toLowerCase();
      if (s === "paid") return "approved";
      if (s === "approved" || s === "rejected" || s === "pending") return s;
      return "pending";
    }

    function safeDate(value) {
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) {
        return "Unknown date";
      }
      return parsed.toLocaleString();
    }

    function statusBadge(status) {
      return `<span class="status-chip ${status}">${status}</span>`;
    }

    function renderRechargeItem(item) {
      const status = normalizeRechargeStatus(item.status);
      const date = safeDate(item.createdAt);
      const li = document.createElement("li");
      li.className = "history-item";

      li.innerHTML = `
        <div class="history-row">
          <strong>${fmt(item.amount)}</strong>
          ${statusBadge(status)}
        </div>
        <div class="history-meta">Phone: ${item.phone || "N/A"}</div>
        <div class="history-meta">Code: ${item.transactionCode || "N/A"}</div>
        <div class="history-meta">${date}</div>
      `;
      return li;
    }

    function renderWithdrawalItem(item) {
      const status = normalizeWithdrawalStatus(item.status);
      const date = safeDate(item.createdAt);
      const li = document.createElement("li");
      li.className = "history-item";

      li.innerHTML = `
        <div class="history-row">
          <strong>${fmt(item.amount)}</strong>
          ${statusBadge(status)}
        </div>
        <div class="history-meta">Tax: ${fmt(item.tax || 0)} | Net: ${fmt(item.net || 0)}</div>
        <div class="history-meta">Phone: ${item.phone || "N/A"}</div>
        <div class="history-meta">${date}</div>
      `;
      return li;
    }

    async function fetchJsonWithTimeout(url) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);
      try {
        const res = await fetch(url, { cache: "no-store", signal: controller.signal });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || "Failed request");
        }
        return data;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function loadTransactionHistory(userId) {
      const rechargeList = document.getElementById("rechargeList");
      const withdrawalList = document.getElementById("withdrawalList");
      rechargeList.innerHTML = '<li class="history-item">Loading recharge history...</li>';
      withdrawalList.innerHTML = '<li class="history-item">Loading withdrawal history...</li>';

      const [recharges, withdrawals] = await Promise.all([
        fetchJsonWithTimeout(`${BASE_URL}/api/recharges/${userId}`),
        fetchJsonWithTimeout(`${BASE_URL}/api/withdrawals/${userId}`)
      ]);

      const rechargeArray = Array.isArray(recharges) ? recharges : [];
      const withdrawalArray = Array.isArray(withdrawals) ? withdrawals : [];

      const totalApprovedRecharges = rechargeArray
        .filter((r) => normalizeRechargeStatus(r.status) === "approved")
        .reduce((sum, r) => sum + Number(r.amount || 0), 0);

      const totalApprovedWithdrawals = withdrawalArray
        .filter((w) => normalizeWithdrawalStatus(w.status) === "approved")
        .reduce((sum, w) => sum + Number(w.amount || 0), 0);

      const rechargePendingCount = rechargeArray
        .filter((r) => normalizeRechargeStatus(r.status) === "pending")
        .length;

      const withdrawalPendingCount = withdrawalArray
        .filter((w) => normalizeWithdrawalStatus(w.status) === "pending")
        .length;

      document.getElementById("tRecharge").textContent = fmt(totalApprovedRecharges);
      document.getElementById("tWithdraw").textContent = fmt(totalApprovedWithdrawals);
      document.getElementById("countRechargePending").textContent = String(rechargePendingCount);
      document.getElementById("countWithdrawalPending").textContent = String(withdrawalPendingCount);

      rechargeList.innerHTML = "";
      if (!rechargeArray.length) {
        rechargeList.innerHTML = '<li class="history-item">No recharge history found.</li>';
      } else {
        rechargeArray.forEach((item) => rechargeList.appendChild(renderRechargeItem(item)));
      }

      withdrawalList.innerHTML = "";
      if (!withdrawalArray.length) {
        withdrawalList.innerHTML = '<li class="history-item">No withdrawal history found.</li>';
      } else {
        withdrawalArray.forEach((item) => withdrawalList.appendChild(renderWithdrawalItem(item)));
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (typeof protectPage === "function") {
        try {
          await Promise.race([
            protectPage(),
            new Promise((_, reject) => setTimeout(() => reject(new Error("Session check timeout")), 8000))
          ]);
        } catch (_) {
          // Do not block page rendering if session refresh hangs.
        }
      }

      const user = getCurrentUser();
      if (!user || !user._id) {
        window.location.href = "login.html";
        return;
      }

      const refreshButton = document.getElementById("refreshHistoryBtn");
      refreshButton.addEventListener("click", async () => {
        try {
          refreshButton.disabled = true;
          refreshButton.textContent = "Refreshing...";
          await loadTransactionHistory(user._id);
        } catch (err) {
          document.getElementById("rechargeList").innerHTML = `<li class="history-item">Failed to load recharge history. ${String(err.message || "")}</li>`;
          document.getElementById("withdrawalList").innerHTML = `<li class="history-item">Failed to load withdrawal history. ${String(err.message || "")}</li>`;
        } finally {
          refreshButton.disabled = false;
          refreshButton.textContent = "Refresh";
        }
      });

      try {
        await loadTransactionHistory(user._id);
      } catch (err) {
        document.getElementById("rechargeList").innerHTML = `<li class="history-item">Failed to load recharge history. ${String(err.message || "")}</li>`;
        document.getElementById("withdrawalList").innerHTML = `<li class="history-item">Failed to load withdrawal history. ${String(err.message || "")}</li>`;
      }

      historyPollTimer = setInterval(async () => {
        try {
          await loadTransactionHistory(user._id);
        } catch (_) {
          // Silent retry on next cycle.
        }
      }, 15000);

      window.addEventListener("beforeunload", () => {
        if (historyPollTimer) {
          clearInterval(historyPollTimer);
        }
      });
    });
  </script>
  <script src="nav.js"></script>
</body>
</html>
