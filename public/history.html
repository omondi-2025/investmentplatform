<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>TUST VANILLA - History</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    .history-wrap { max-width: 760px; margin: 1rem auto; padding: 0 1rem 1rem; }
    .history-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
    .history-total { background: #fff; border-radius: 12px; box-shadow: var(--shadow-sm); padding: 0.9rem; }
    .history-total small { color: var(--text-2); display: block; margin-bottom: 4px; }
    .history-total strong { color: var(--primary); font-size: 1rem; }
    .history-list { list-style: none; padding: 0; margin: 0; }
    .history-item { background: #fff; border-radius: 12px; box-shadow: var(--shadow-sm); margin-bottom: 0.65rem; padding: 0.9rem; }
    .history-item .meta { color: var(--text-2); font-size: 0.8rem; margin-top: 3px; }
    .pill { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 4px 8px; margin-bottom: 6px; }
    .pill.investment { background: #dbeafe; color: #1e40af; }
    .pill.recharge { background: #dcfce7; color: #166534; }
    .pill.withdrawal { background: #fee2e2; color: #991b1b; }
    .pill.referral { background: #ede9fe; color: #5b21b6; }
    @media (max-width: 600px) { .history-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <a href="profile.html" class="back-arrow"><span class="material-symbols-outlined">arrow_back</span></a>
    <h3>TUST VANILLA - History</h3>
    <span style="width:24px;"></span>
  </header>

  <div class="history-wrap">
    <div class="history-grid">
      <div class="history-total"><small>Investment Earnings</small><strong id="tInvestment">KES 0.00</strong></div>
      <div class="history-total"><small>Recharged Cash</small><strong id="tRecharge">KES 0.00</strong></div>
      <div class="history-total"><small>Withdrawn Cash</small><strong id="tWithdraw">KES 0.00</strong></div>
      <div class="history-total"><small>Referral Earnings</small><strong id="tReferral">KES 0.00</strong></div>
    </div>

    <div class="card">
      <div class="section-title">Activity Timeline</div>
      <ul id="historyList" class="history-list">
        <li class="history-item">Loading history...</li>
      </ul>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const BASE_URL = ["localhost", "127.0.0.1"].includes(window.location.hostname)
      ? window.location.origin
      : "https://investmentplatform.onrender.com";

    function fmt(value) {
      return `KES ${Number(value || 0).toFixed(2)}`;
    }

    function renderItem(item) {
      const date = new Date(item.date).toLocaleString();
      const li = document.createElement("li");
      li.className = "history-item";

      let extra = item.note || "";
      if (item.type === "withdrawal") {
        extra = `${item.note || "Cash withdrawal"} | Tax: KES ${Number(item.tax || 0).toFixed(2)} | Net: KES ${Number(item.net || 0).toFixed(2)}`;
      }
      if (item.type === "recharge") {
        extra = `${item.note || "Wallet recharge"} | Status: ${(item.status || "pending").toUpperCase()}`;
      }
      if (item.type === "investment") {
        extra = `${item.note || "Investment earnings"} | Status: ${(item.status || "active").toUpperCase()}`;
      }

      li.innerHTML = `
        <span class="pill ${item.type}">${item.type.toUpperCase()}</span>
        <div><strong>${fmt(item.amount)}</strong></div>
        <div class="meta">${extra}</div>
        <div class="meta">${date}</div>
      `;
      return li;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await protectPage();
      const user = getCurrentUser();
      if (!user || !user._id) {
        window.location.href = "login.html";
        return;
      }

      try {
        const res = await fetch(`${BASE_URL}/api/history/${user._id}`);
        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.message || "Failed to load history");
        }

        document.getElementById("tInvestment").textContent = fmt(data.totals.investmentEarnings);
        document.getElementById("tRecharge").textContent = fmt(data.totals.rechargedCash);
        document.getElementById("tWithdraw").textContent = fmt(data.totals.withdrawnCash);
        document.getElementById("tReferral").textContent = fmt(data.totals.referralEarnings);

        const list = document.getElementById("historyList");
        list.innerHTML = "";
        if (!Array.isArray(data.items) || data.items.length === 0) {
          list.innerHTML = '<li class="history-item">No history records found.</li>';
          return;
        }

        data.items.forEach((item) => list.appendChild(renderItem(item)));
      } catch (err) {
        document.getElementById("historyList").innerHTML = '<li class="history-item">Failed to load history records.</li>';
      }
    });
  </script>
  <script src="nav.js"></script>
</body>
</html>
