<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="icon" href="tust-vanilla-icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="tust-vanilla-icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#004aad" />
<title>Packages - TUST VANILLA</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #f4f8fb;
      padding: 1rem;
    }

    header {
      background-color: #004aad;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    .wallet {
      background: #ffffff;
      padding: 1rem;
      border-radius: 8px;
      max-width: 300px;
      margin: 1rem auto;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .wallet strong {
      color: #004aad;
      font-size: 1.4rem;
    }

    .packages {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 2rem;
    }

    .package-card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      text-align: center;
      transition: transform 0.2s ease;
    }

    .package-card:hover {
      transform: translateY(-5px);
    }

    .package-card h3 {
      margin: 0;
      color: #004aad;
      font-size: 1.4rem;
    }

    .package-card p {
      margin: 8px 0;
      color: #333;
    }

    .package-card button {
      background-color: #004aad;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease;
    }

    .package-card button:hover {
      background-color: #00317a;
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <header>
    <h2> Investment Packages</h2>
  </header>

  <div class="wallet">
    Wallet Balance: <strong id="walletBalance">KES 0</strong>
  </div>

  <div class="packages" id="packageContainer"></div>

  <div style="margin-top:2rem;">
    <h3 style="color:#004aad; margin-bottom:10px;">Package History</h3>
    <div id="packageHistory" style="display:grid; gap:10px;"></div>
  </div>

  <script>
    // Simulate logged-in user (replace with your real localStorage logic)
    const user = JSON.parse(localStorage.getItem("tc_user")); //  match login page

    if (!user) {
      alert("You must be logged in to view this page.");
      window.location.href = "login.html";
    }

    let wallet = user.wallet || 0;
    const walletDisplay = document.getElementById("walletBalance");
    walletDisplay.textContent = `KES ${Number(wallet).toFixed(2)}`;

    const investmentPackages = [
      { amount: 300, daily: 80, duration: 7 },
      { amount: 500, daily: 130, duration: 45 },
      { amount: 900, daily: 240, duration: 45 },
      { amount: 1700, daily: 453, duration: 45 },
      { amount: 5000, daily: 1330, duration: 45 },
      { amount: 10000, daily: 2660, duration: 45 },
      { amount: 20000, daily: 5320, duration: 45 }
    ];

    const container = document.getElementById("packageContainer");

    investmentPackages.forEach(plan => {
      const card = document.createElement("div");
      card.className = "package-card";
      card.innerHTML = `
        <h3>KES ${plan.amount}</h3>
        <p> Daily Earning: KES ${plan.daily}</p>
        <p> Duration: ${plan.duration} days</p>
        <button onclick="invest(${plan.amount}, ${plan.daily}, ${plan.duration})">Invest</button>
      `;
      container.appendChild(card);
    });

   function formatDateTime(value) {
    return new Date(value).toLocaleString();
   }

   function computeDaysRemaining(endDate) {
    const diff = new Date(endDate).getTime() - Date.now();
    return Math.max(0, Math.ceil(diff / 86400000));
   }

   function computeTotalEarned(inv) {
    const totalDays = Number(inv.initialDurationDays || inv.durationDays || 1);
    const elapsedDays = Math.max(0, totalDays - Number(inv.durationDays || 0));
    const daily = Number(inv.returnAmount || 0) / totalDays;
    if (String(inv.status).toLowerCase() === "completed") {
      return Number(inv.returnAmount || 0);
    }
    return Number((daily * elapsedDays).toFixed(2));
   }

   function nextEarningReflection(inv) {
    const base = inv.lastPayoutDate ? new Date(inv.lastPayoutDate) : new Date(inv.startDate || inv.createdAt || Date.now());
    base.setDate(base.getDate() + 1);
    return base.toLocaleString();
   }

   async function loadPackageHistory() {
    const historyBox = document.getElementById("packageHistory");
    historyBox.innerHTML = '<div style="background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:12px;">Loading package history...</div>';

    try {
      const BASE_URL = ["localhost", "127.0.0.1"].includes(window.location.hostname)
        ? window.location.origin
        : "https://investmentplatform.onrender.com";

      const res = await fetch(`${BASE_URL}/api/investments/${user._id}`, { cache: "no-store" });
      const data = await res.json();
      const investments = Array.isArray(data.investments) ? data.investments : [];

      if (!investments.length) {
        historyBox.innerHTML = '<div style="background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:12px;">No package history yet.</div>';
        return;
      }

      historyBox.innerHTML = "";
      investments.forEach((inv) => {
        const status = String(inv.status || "active").toLowerCase();
        const statusBg = status === "completed" ? "#dcfce7" : "#fef3c7";
        const statusColor = status === "completed" ? "#166534" : "#92400e";
        const totalDays = Number(inv.initialDurationDays || inv.durationDays || 0);
        const dailyEarning = totalDays > 0 ? Number(inv.returnAmount || 0) / totalDays : 0;

        const card = document.createElement("div");
        card.style.cssText = "background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:12px;";
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <strong>${inv.planName || "Package"}</strong>
            <span style="padding:4px 8px; border-radius:999px; background:${statusBg}; color:${statusColor}; font-size:12px; font-weight:700;">${status.toUpperCase()}</span>
          </div>
          <div style="margin-top:6px; font-size:13px; color:#334155;">Amount Invested: KES ${Number(inv.planAmount || 0).toFixed(2)}</div>
          <div style="margin-top:4px; font-size:13px; color:#334155;">Total Earned: KES ${computeTotalEarned(inv).toFixed(2)}</div>
          <div style="margin-top:4px; font-size:13px; color:#334155;">Days Remaining: ${computeDaysRemaining(inv.endDate)}</div>
          <div style="margin-top:4px; font-size:13px; color:#334155;">Started: ${formatDateTime(inv.startDate || inv.createdAt)}</div>
          <div style="margin-top:4px; font-size:13px; color:#334155;">Ends: ${formatDateTime(inv.endDate)}</div>
          <div style="margin-top:4px; font-size:13px; color:#334155;">Daily Earning: KES ${dailyEarning.toFixed(2)}</div>
          <div style="margin-top:4px; font-size:12px; color:#64748b;">Next earnings reflection: ${nextEarningReflection(inv)}</div>
        `;
        historyBox.appendChild(card);
      });
    } catch (err) {
      historyBox.innerHTML = '<div style="background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:12px; color:#991b1b;">Failed to load package history.</div>';
    }
   }

   async function refreshWallet() {
    const BASE_URL = ["localhost", "127.0.0.1"].includes(window.location.hostname)
      ? window.location.origin
      : "https://investmentplatform.onrender.com";
    const res = await fetch(`${BASE_URL}/api/user/${user._id}`, { cache: "no-store" });
    const fresh = await res.json();
    if (res.ok && fresh && fresh._id) {
      wallet = Number(fresh.wallet || 0);
      walletDisplay.textContent = `KES ${wallet.toFixed(2)}`;
      localStorage.setItem("tc_user", JSON.stringify({ ...fresh, lastUpdated: Date.now() }));
    }
   }

   async function invest(amount, daily, duration) {
  if (wallet < amount) {
    alert(" Insufficient wallet balance.");
    return;
  }

  const confirmInvest = confirm(`Invest KES ${amount} for ${duration} days?\nDaily return: KES ${daily}`);
  if (!confirmInvest) return;

  const investment = {
    userId: user._id,
    planName: `KES ${amount}`,
    planAmount: Number(amount),
    durationDays: Number(duration),
    returnAmount: Number(daily) * Number(duration)
  };

  const BASE_URL = ["localhost", "127.0.0.1"].includes(window.location.hostname)
    ? window.location.origin
    : "https://investmentplatform.onrender.com";

  try {
    const res = await fetch(`${BASE_URL}/api/invest`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(investment)
    });

    const result = await res.json();

    if (res.ok) {
      await refreshWallet();
      await loadPackageHistory();
      alert(" Investment successful!");
    } else {
      alert(" " + (result.message || "Investment failed."));
    }
  } catch (err) {
    console.error(err);
    alert(" Network error. Try again.");
  }
}

  document.addEventListener("DOMContentLoaded", async () => {
    await refreshWallet();
    await loadPackageHistory();
  });
  </script>
  <script src="nav.js"></script></body>
</html>
