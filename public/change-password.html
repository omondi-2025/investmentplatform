<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="api.js"></script>
  <script src="auth-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="icon" href="tust-vanilla-icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="tust-vanilla-icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#004aad" />
<title>Change Password - TUST VANILLA</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e6f0ff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      max-width: 400px;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 90%;
    }

    h2 {
      color: #004aad;
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      background: #004aad;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .alert {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      text-align: center;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <div class="container">
    <h2> Change Password</h2>
    <form id="passwordForm">
      <label for="currentPassword">Current Password</label>
<input type="password" id="currentPassword" required placeholder="Enter current password" />

<label for="newPassword">New Password</label>
<input type="password" id="newPassword" required placeholder="Enter new password" minlength="6" pattern=".{6,}" title="Minimum 6 characters" />

      <button type="submit">Update Password</button>
      <div id="message"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById("passwordForm");
    const messageDiv = document.getElementById("message");
    const BASE_URL = ["localhost", "127.0.0.1"].includes(window.location.hostname)
      ? window.location.origin
      : "https://investmentplatform.onrender.com";
	
    form.addEventListener("submit", async (e) => {
  e.preventDefault();
  messageDiv.textContent = "";
  messageDiv.className = "alert";

  const currentPassword = document.getElementById("currentPassword").value.trim();
  const newPassword = document.getElementById("newPassword").value.trim();
  const user = JSON.parse(localStorage.getItem("tc_user"));

  if (!user || !user._id) {
  window.location.href = "login.html";
  return;
}

  try {
    const res = await API.apiFetch("/api/user/update-password", {
      method: "POST",
      body: JSON.stringify({
        currentPassword,
        newPassword
      })
    });

    const data = await res.json();
    messageDiv.textContent = data.message || "Something went wrong.";
    messageDiv.classList.add(data.success ? "success" : "error");

    if (data.success) {
      setTimeout(() => {
        window.location.href = "profile.html";
      }, 2000);
    }
  } catch (err) {
    console.error(err);
    messageDiv.textContent = " Error connecting to server.";
    messageDiv.classList.add("error");
  }
});
  </script>
  <script src="nav.js"></script></body>
</html>
