<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>TUST VANILLA Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <header>
    <h1>TUST VANILLA Admin</h1>
    <button id="adminLogoutBtn" type="button" style="display:none; max-width:120px;">Logout</button>
  </header>

  <div class="container">
    <div id="adminLoginCard" class="card" style="max-width:420px;margin:1rem auto;">
      <h2 style="margin-bottom:0.75rem;">Admin Login</h2>
      <div class="form-group">
        <label for="adminUsername">Username</label>
        <input id="adminUsername" type="text" placeholder="Enter admin username" />
      </div>
      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input id="adminPassword" type="password" placeholder="Enter admin password" />
      </div>
      <button id="adminLoginBtn" class="btn-primary">Login</button>
      <div id="adminMessage" class="alert" style="display:none;"></div>
    </div>

    <div id="adminPanel" style="display:none;">
      <h2 style="margin-bottom:0.75rem;">Pending Recharges</h2>
      <div id="rechargeList" class="recharge-list">
        <p>Loading recharge requests...</p>
      </div>

      <h2 style="margin:1rem 0 0.75rem;">Pending Withdrawals</h2>
      <div id="withdrawalList" class="recharge-list">
        <p>Loading withdrawal requests...</p>
      </div>
    </div>
  </div>

  <script>
    const apiUrl = window.location.hostname === 'localhost'
      ? window.location.origin
      : 'https://investmentplatform.onrender.com';
    let adminPollTimer = null;

    function getAdminToken() {
      return localStorage.getItem('tv_admin_token') || '';
    }

    function setAdminAuthUi(isLoggedIn) {
      document.getElementById('adminLoginCard').style.display = isLoggedIn ? 'none' : 'block';
      document.getElementById('adminPanel').style.display = isLoggedIn ? 'block' : 'none';
      document.getElementById('adminLogoutBtn').style.display = isLoggedIn ? 'inline-flex' : 'none';
    }

    function clearAdminSession() {
      localStorage.removeItem('tv_admin_token');
      if (adminPollTimer) {
        clearInterval(adminPollTimer);
        adminPollTimer = null;
      }
      setAdminAuthUi(false);
    }

    function startAdminPolling() {
      if (adminPollTimer) {
        clearInterval(adminPollTimer);
      }
      adminPollTimer = setInterval(loadAllAdminData, 10000);
    }

    function showMessage(text, isError = false) {
      const msg = document.getElementById('adminMessage');
      msg.style.display = 'block';
      msg.textContent = text;
      msg.className = isError ? 'alert error' : 'alert success';
    }

    async function adminLogin() {
      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value;

      if (!username || !password) {
        showMessage('Username and password are required.', true);
        return;
      }

      try {
        const res = await fetch(`${apiUrl}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok || !data.success || !data.token) {
          showMessage(data.message || 'Invalid credentials.', true);
          return;
        }

        localStorage.setItem('tv_admin_token', data.token);
        setAdminAuthUi(true);
        await loadAllAdminData();
        startAdminPolling();
        showMessage('Login successful. Admin panel ready.');
      } catch (err) {
        showMessage('Failed to connect to server.', true);
      }
    }

    async function fetchPendingRecharges() {
      const res = await fetch(`${apiUrl}/api/admin/recharges/pending`, {
        headers: { 'x-admin-token': getAdminToken() }
      });
      if (res.status === 401) {
        throw new Error('unauthorized');
      }
      return await res.json();
    }

    async function fetchPendingWithdrawals() {
      const res = await fetch(`${apiUrl}/api/admin/withdrawals/pending`, {
        headers: { 'x-admin-token': getAdminToken() }
      });
      if (res.status === 401) {
        throw new Error('unauthorized');
      }
      return await res.json();
    }

    async function approveRecharge(id, uid, amount) {
      const confirmAction = confirm("Approve this recharge?");
      if (!confirmAction) return;

      const res = await fetch(`${apiUrl}/api/admin/recharge/${id}/approve`, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'x-admin-token': getAdminToken()
        },
        body: JSON.stringify({ uid, amount })
      });

      if (res.ok) {
        showMessage('Recharge approved successfully.');
        loadAllAdminData();
      } else {
        const data = await res.json().catch(() => ({}));
        showMessage(data.message || 'Failed to approve recharge.', true);
      }
    }

    async function rejectRecharge(id) {
      const confirmAction = confirm("Reject this recharge?");
      if (!confirmAction) return;

      const res = await fetch(`${apiUrl}/api/admin/recharge/${id}/reject`, {
        method: 'POST',
        headers: { 'x-admin-token': getAdminToken() }
      });

      if (res.ok) {
        showMessage('Recharge rejected successfully.');
        loadAllAdminData();
      } else {
        const data = await res.json().catch(() => ({}));
        showMessage(data.message || 'Failed to reject recharge.', true);
      }
    }

    async function approveWithdrawal(id) {
      const confirmAction = confirm('Approve this withdrawal?');
      if (!confirmAction) return;

      const res = await fetch(`${apiUrl}/api/admin/withdrawals/${id}/approve`, {
        method: 'POST',
        headers: { 'x-admin-token': getAdminToken() }
      });

      if (res.ok) {
        showMessage('Withdrawal approved successfully.');
        loadAllAdminData();
      } else {
        const data = await res.json().catch(() => ({}));
        showMessage(data.message || 'Failed to approve withdrawal.', true);
      }
    }

    async function rejectWithdrawal(id) {
      const confirmAction = confirm('Reject this withdrawal? Funds will be refunded to user wallet.');
      if (!confirmAction) return;

      const res = await fetch(`${apiUrl}/api/admin/withdrawals/${id}/reject`, {
        method: 'PATCH',
        headers: { 'x-admin-token': getAdminToken() }
      });

      if (res.ok) {
        showMessage('Withdrawal rejected and refunded.');
        loadAllAdminData();
      } else {
        const data = await res.json().catch(() => ({}));
        showMessage(data.message || 'Failed to reject withdrawal.', true);
      }
    }

    function renderRechargeCard(recharge) {
      const card = document.createElement("div");
      card.className = "card";

      const date = new Date(recharge.createdAt).toLocaleString();

      card.innerHTML = `
        <p><strong>Name:</strong> ${recharge.name}</p>
        <p><strong>Phone:</strong> ${recharge.phone}</p>
        <p><strong>Amount:</strong> KES ${recharge.amount}</p>
        <p><strong>Message:</strong> ${recharge.message || "N/A"}</p>
        <p class="timestamp"><strong>Date:</strong> ${date}</p>
        <div class="actions">
          <button class="approve" onclick="approveRecharge('${recharge._id}', '${recharge.uid}', ${recharge.amount})">Approve</button>
          <button class="reject" onclick="rejectRecharge('${recharge._id}')">Reject</button>
        </div>
      `;

      document.getElementById("rechargeList").appendChild(card);
    }

    function renderWithdrawalCard(withdrawal) {
      const card = document.createElement('div');
      card.className = 'card';
      const date = new Date(withdrawal.createdAt).toLocaleString();

      card.innerHTML = `
        <p><strong>User ID:</strong> ${withdrawal.uid}</p>
        <p><strong>Phone:</strong> ${withdrawal.phone || 'N/A'}</p>
        <p><strong>Amount:</strong> KES ${Number(withdrawal.amount || 0).toFixed(2)}</p>
        <p><strong>Tax:</strong> KES ${Number(withdrawal.tax || 0).toFixed(2)}</p>
        <p><strong>Net:</strong> KES ${Number(withdrawal.net || 0).toFixed(2)}</p>
        <p class="timestamp"><strong>Date:</strong> ${date}</p>
        <div class="actions">
          <button class="approve" onclick="approveWithdrawal('${withdrawal._id}')">Approve</button>
          <button class="reject" onclick="rejectWithdrawal('${withdrawal._id}')">Reject</button>
        </div>
      `;

      document.getElementById('withdrawalList').appendChild(card);
    }

    async function loadRecharges() {
      const listBox = document.getElementById("rechargeList");
      listBox.innerHTML = "<p>Loading recharge requests...</p>";

      try {
        const recharges = await fetchPendingRecharges();
        listBox.innerHTML = "";

        if (!recharges.length) {
          listBox.innerHTML = "<p>No pending recharges found.</p>";
        } else {
          recharges.forEach(renderRechargeCard);
        }
      } catch (err) {
        if (String(err.message).includes('unauthorized')) {
          clearAdminSession();
          showMessage('Session expired. Please log in again.', true);
        } else {
          showMessage('Failed to load recharge records.', true);
        }
      }
    }

    async function loadWithdrawals() {
      const listBox = document.getElementById('withdrawalList');
      listBox.innerHTML = '<p>Loading withdrawal requests...</p>';

      try {
        const withdrawals = await fetchPendingWithdrawals();
        listBox.innerHTML = '';

        if (!withdrawals.length) {
          listBox.innerHTML = '<p>No pending withdrawals found.</p>';
        } else {
          withdrawals.forEach(renderWithdrawalCard);
        }
      } catch (err) {
        if (String(err.message).includes('unauthorized')) {
          clearAdminSession();
          showMessage('Session expired. Please log in again.', true);
        } else {
          showMessage('Failed to load withdrawal records.', true);
        }
      }
    }

    async function loadAllAdminData() {
      await Promise.all([loadRecharges(), loadWithdrawals()]);
    }

    document.getElementById('adminLoginBtn').addEventListener('click', adminLogin);
    document.getElementById('adminPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        adminLogin();
      }
    });
    document.getElementById('adminLogoutBtn').addEventListener('click', () => {
      clearAdminSession();
      showMessage('Logged out.');
    });
    window.onload = async () => {
      if (getAdminToken()) {
        setAdminAuthUi(true);
        await loadAllAdminData();
        startAdminPolling();
      } else {
        setAdminAuthUi(false);
      }
    };
  </script>
  <script src="nav.js"></script>
</body>
</html>
